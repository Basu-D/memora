server {
    listen ${PORT};
    server_name _;

    # ── API proxy ─────────────────────────────────────────────────────────────
    # All requests to /api/* are forwarded to the FastAPI backend.
    # The /api prefix is stripped before forwarding (trailing slash on proxy_pass).
    location /api/ {
        # Re-resolve backend.railway.internal via the container's DNS resolver.
        # NGINX_RESOLVER is extracted from /etc/resolv.conf at startup (see Dockerfile CMD)
        # because Railway (Kubernetes) doesn't expose Docker's 127.0.0.11 DNS.
        # The variable form of proxy_pass forces per-request DNS lookup instead of
        # caching the IP at startup — which breaks after Railway redeploys the backend.
        resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
        set $upstream "${BACKEND_URL}";
        # nginx skips location-prefix stripping when proxy_pass uses a variable,
        # so we strip /api/ explicitly with a rewrite before proxying.
        rewrite ^/api/(.*) /$1 break;
        proxy_pass         $upstream;

        # Required when BACKEND_URL is https:// — sends SNI so Railway's edge
        # can select the correct certificate during the TLS handshake.
        proxy_ssl_server_name on;

        proxy_http_version 1.1;
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large file uploads (up to 510 MB to give a small buffer over
        # the application-level 500 MB limit)
        client_max_body_size 510m;

        # Longer timeouts for Whisper transcription (can take several minutes)
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    # ── Static assets ─────────────────────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    # Immutable JS/CSS chunks produced by Vite (include content hash in filename)
    location ~* \.(?:js|css)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # Other static files — shorter cache since they may change between deploys
    location ~* \.(?:png|jpg|jpeg|svg|ico|woff2?|webp|gif)$ {
        expires    30d;
        add_header Cache-Control "public";
        try_files  $uri =404;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # Any route not matched above returns index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
