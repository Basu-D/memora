# Alembic configuration — run from the backend/ directory.
# Usage:
#   alembic upgrade head        # apply all pending migrations
#   alembic downgrade -1        # roll back last migration
#   alembic revision --autogenerate -m "description"  # generate a new migration

[alembic]
script_location = %(here)s/alembic

# File naming: YYYYMMDD_<rev>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# The URL is overridden in env.py from config.settings.db_url.
# Leave this as a placeholder so `alembic` doesn't error on startup.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
